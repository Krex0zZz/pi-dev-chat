<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>pi.dev Chat</title>
<style>
:root {
    --bg:#1B1F20; --surf:#252A2D; --surf2:#2F3539;
    --pri:#7C5CFC; --pri2:#5E43C4;
    --txt:#E8EAED; --txt2:#9AA0A6; --brd:#363B3F;
    --u-bg:#2D2558; --err:#FF5252; --ok:#00E676;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{display:flex;align-items:center;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--brd);min-height:52px;gap:10px}
#hdr .logo{width:28px;height:28px;background:var(--pri);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
#hdr .title{font-weight:600;font-size:16px;flex:1}
#hdr .status{font-size:11px;color:var(--txt2);padding:2px 8px;border-radius:10px;background:var(--surf2)}
#chat{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--u-bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surf);border:1px solid var(--brd);border-bottom-left-radius:4px}
.msg.s{align-self:center;font-size:12px;color:var(--txt2);background:transparent;text-align:center}
.msg .tc{margin-top:6px;padding:6px 10px;background:var(--surf2);border-radius:8px;font-size:12px;font-family:monospace;color:var(--txt2);display:flex;align-items:center;gap:6px}
.msg .tc .dot{width:6px;height:6px;border-radius:50%;background:var(--pri);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.msg .tr{margin-top:4px;padding:6px 10px;background:var(--bg);border-radius:8px;font-size:11px;font-family:monospace;color:var(--txt2);max-height:120px;overflow-y:auto}
#ia{padding:8px 12px 16px;background:var(--surf);border-top:1px solid var(--brd)}
#ir{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;background:var(--surf2);border:1px solid var(--brd);border-radius:20px;padding:10px 16px;color:var(--txt);font-size:14px;font-family:inherit;resize:none;max-height:120px;line-height:1.4}
#inp:focus{outline:none;border-color:var(--pri)}
#inp::placeholder{color:var(--txt2)}
#sb{width:40px;height:40px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
#sb:disabled{background:var(--surf2);cursor:not-allowed}
#sb:not(:disabled):hover{background:var(--pri2)}
#tb{display:flex;gap:12px;padding:4px 0 0}
#tb button{background:none;border:none;color:var(--txt2);font-size:12px;cursor:pointer;padding:2px 0;font-family:inherit}
#tb button:hover{color:var(--txt)}
.td{display:inline-flex;gap:3px;padding:4px 0}
.td span{width:5px;height:5px;border-radius:50%;background:var(--txt2);animation:blink 1.4s infinite}
.td span:nth-child(2){animation-delay:.2s}
.td span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
</style>
</head>
<body>
<div id="hdr">
    <div class="logo">π</div>
    <div class="title">pi.dev</div>
    <div class="status" id="badge">connecting…</div>
</div>
<div id="chat"></div>
<div id="ia">
    <div id="ir">
        <textarea id="inp" rows="1" placeholder="Ask pi something…"></textarea>
        <button id="sb" disabled>▶</button>
    </div>
    <div id="tb">
        <button onclick="send('abort')">⏹ Stop</button>
        <button onclick="send('new_session')">↻ New</button>
        <button onclick="goConfig()">⚙ Settings</button>
    </div>
</div>
<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
const sb=document.getElementById('sb');
const badge=document.getElementById('badge');
let aiMsg=null,streaming=false;

inp.addEventListener('input',()=>{
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,120)+'px';
    sb.disabled=!inp.value.trim();
});
inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});
sb.addEventListener('click',sendMsg);

function sendMsg(){
    const t=inp.value.trim();if(!t)return;
    inp.value='';inp.style.height='auto';sb.disabled=true;
    add('u',t);
    ChatBridge.send(JSON.stringify({type:"prompt",message:t}));
}

function send(type){
    ChatBridge.send(JSON.stringify({type:type}));
}

function add(role,text){
    const d=document.createElement('div');
    d.className='msg '+(role==='user'?'u':role==='ai'?'a':'s');
    if(role==='ai'){d.id='ai-'+Date.now();aiMsg=d;}
    d.textContent=text;chat.appendChild(d);scroll();return d;
}

function scroll(){chat.scrollTop=chat.scrollHeight;}

function toolCall(name,args){
    if(!aiMsg)return;
    const d=document.createElement('div');d.className='tc';
    d.innerHTML=`<span class="dot"></span><span>${name}(${JSON.stringify(args||{}).substring(0,80)}…)</span>`;
    aiMsg.appendChild(d);scroll();
}

function toolResult(name,txt){
    if(!aiMsg)return;
    const d=document.createElement('div');d.className='tr';
    d.textContent=`[${name}] ${(txt||'').substring(0,300)}`;
    aiMsg.appendChild(d);scroll();
}

function showTyping(){
    if(aiMsg&&aiMsg.querySelector('.td'))return;
    aiMsg=document.createElement('div');aiMsg.className='msg a';
    aiMsg.innerHTML='<div class="td"><span></span><span></span><span></span></div>';
    chat.appendChild(aiMsg);scroll();
}

function hideTyping(){
    if(aiMsg&&aiMsg.querySelector('.td'))aiMsg.textContent='';
}

// ── WebSocket event handlers ──

window.onWsOpen=function(){
    badge.textContent='connected';badge.style.color='#00E676';
    add('s','pi agent connected');sb.disabled=false;inp.focus();
};

window.onWsClose=function(){
    badge.textContent='disconnected';badge.style.color='#FF5252';
    add('s','Disconnected — reconnecting…');
};

window.onWsError=function(err){
    badge.textContent='error';badge.style.color='#FF5252';
    add('s','Error: '+err);
};

window.onMessage=function(jsonLine){
    let ev;try{ev=JSON.parse(jsonLine);}catch(e){return;}
    switch(ev.type){
        case 'agent_start':
            streaming=true;showTyping();break;
        case 'agent_end':
            streaming=false;aiMsg=null;
            sb.disabled=!inp.value.trim();inp.focus();break;
        case 'message_update':{
            const am=ev.assistantMessageEvent;if(!am)break;
            if(am.type==='start'||am.type==='text_start'){
                hideTyping();
                if(!aiMsg)aiMsg=add('ai','');
            }
            if(am.type==='text_delta'&&aiMsg){
                aiMsg.textContent+=am.delta;scroll();
            }
            if(am.type==='toolcall_end'){
                const tc=am.toolCall;
                toolCall(tc.name,tc.args);
            }
            break;
        }
        case 'tool_execution_end':
            if(ev.result&&ev.result.content){
                const txt=ev.result.content.map(c=>c.text||'').join('\n');
                toolResult(ev.toolName,txt);
            }break;
        case 'compaction_start':add('s','Compacting context…');break;
        case 'compaction_end':add('s','Compaction complete');break;
        case 'auto_retry_start':
            add('s','Retrying… '+(ev.errorMessage||'').substring(0,60));break;
        case 'auto_retry_end':
            if(!ev.success)add('s','Retry failed: '+(ev.finalError||'unknown'));break;
    }
};

function goConfig(){
    ChatBridge.send(JSON.stringify({type:'__config'}));
}
</script>
</body>
</html>
