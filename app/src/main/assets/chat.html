<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pi Dev Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000000;
  --surface:#0A0A12;
  --surface2:#141120;
  --primary:#7C3AED;
  --primary-glow:rgba(124,58,237,0.25);
  --user-bubble:#1A0F2E;
  --ai-bubble:#0D0B14;
  --text:#E8E0F0;
  --text2:#7A7390;
  --border:#1C1630;
  --status-on:#7C3AED;
  --status-warn:#F59E0B;
  --status-err:#EF4444;
  --code:#181428;
}
html,body{height:100%;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}body{display:flex;flex-direction:column}

#header{display:flex;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);gap:8px;height:44px}
#header h1{font-size:14px;font-weight:600;color:var(--text);flex:1;letter-spacing:0.3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text2);transition:all 0.3s}
.dot.on{background:var(--status-on);box-shadow:0 0 6px var(--primary-glow)}
.dot.wn{background:var(--status-warn)}
.dot.er{background:var(--status-err);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.3}}
.hbtn{background:none;border:none;color:var(--text2);font-size:18px;padding:4px 8px;line-height:1;cursor:pointer}

#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}

.msg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word;position:relative}
.msg.user{align-self:flex-end;background:var(--user-bubble);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--ai-bubble);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .ts{display:block;font-size:10px;color:var(--text2);margin-bottom:2px;text-align:right}

.thinking{background:var(--code);border:1px solid var(--border);border-radius:8px;margin:4px 0;padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;max-height:120px;overflow:hidden;transition:max-height 0.3s}
.thinking.expanded{max-height:600px;overflow-y:auto}
.thinking-header{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--primary);margin-bottom:4px;display:flex;justify-content:space-between}

.code{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:monospace;font-size:12px;margin:4px 0;white-space:pre-wrap;overflow-x:auto;color:var(--text)}
.msg p{margin:4px 0}

#typing{align-self:flex-start;padding:8px 16px;background:var(--ai-bubble);border:1px solid var(--border);border-radius:14px;font-size:13px;color:var(--text2)}
.typing-dots{display:inline-flex;gap:3px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--primary);display:inline-block;animation:bounce 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

#inputBar{display:flex;align-items:flex-end;padding:8px;background:var(--surface);border-top:1px solid var(--border);gap:6px}
#input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 14px;color:var(--text);font-size:14px;resize:none;max-height:120px;font-family:inherit;outline:none;line-height:1.3}
#input:focus{border-color:var(--primary)}
#input::placeholder{color:var(--text2)}
.ibtn{border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
#sendBtn{background:var(--primary);color:#fff}
#sendBtn:active{transform:scale(0.92)}
#stopBtn,#newBtn{background:var(--surface2);color:var(--text2)}
#stopBtn,#newBtn{display:none}

#overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:99;color:var(--text)}
#overlay.show{display:flex}
#overlay .msg2{font-size:15px;color:var(--text2)}
#overlay .count{font-size:36px;font-weight:700;color:var(--primary)}
#overlay button{background:var(--primary);color:#fff;border:none;padding:10px 28px;border-radius:20px;font-size:14px;cursor:pointer}

.tool-call{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;margin:4px 0}
.tool-call .tname{color:var(--primary);font-weight:600}
.tool-call .targs{color:var(--text2);white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<div id="header">
  <button class="hbtn" id="configBtn">&#9881;</button>
  <h1>Pi Dev Chat</h1>
  <div class="dot" id="statusDot"></div>
</div>
<div id="chat"></div>
<div id="inputBar">
  <button class="ibtn" id="newBtn" title="New session">✦</button>
  <button class="ibtn" id="stopBtn" title="Stop">&stop;</button>
  <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
  <button class="ibtn" id="sendBtn" title="Send">▶</button>
</div>
<div id="overlay">
  <div class="msg2">Disconnected</div>
  <div class="count" id="countDown">--</div>
  <button onclick="ChatBridge.openConfig()">Open Settings</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');
const newBtn = document.getElementById('newBtn');
const statusDot = document.getElementById('statusDot');
const overlay = document.getElementById('overlay');
const configBtn = document.getElementById('configBtn');

let typingEl = null;
let aiMsg = null;
let aiTextSpan = null;
let aiThinkingEl = null;
let aiThinkingSpan = null;
let isProcessing = false;
let hasResponded = false;
let reconnectTimer = null;
let countNum = 0;

function ts() {
    const d = new Date();
    return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function scroll() {
    chat.scrollTop = chat.scrollHeight;
}

function addUserMsg(text) {
    const d = document.createElement('div');
    d.className = 'msg user';
    d.innerHTML = '<span class="ts">' + ts() + '</span>' + esc(text);
    chat.appendChild(d);
    scroll();
}

function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement('div');
    typingEl.id = 'typing';
    typingEl.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
    chat.appendChild(typingEl);
    scroll();
}

function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
}

function addToolCall(name, args) {
    if (hasResponded) return;
    const d = document.createElement('div');
    d.className = 'tool-call';
    d.innerHTML = '<span class="tname">⚡ ' + esc(name) + '</span><span class="targs">' + esc(JSON.stringify(args||{})) + '</span>';
    chat.appendChild(d);
    scroll();
}

function setBtns(on) {
    sendBtn.style.display = on ? 'none' : 'flex';
    stopBtn.style.display = on ? 'flex' : 'none';
    newBtn.style.display = on ? 'none' : 'flex';
    input.disabled = on;
}

window.onMessage = function(jsonLine) {
    let ev;
    try { ev = JSON.parse(jsonLine); } catch(e) { return; }
    switch (ev.type) {
    case 'agent_start':
        isProcessing = true;
        hasResponded = false;
        hideTyping();
        showTyping();
        setBtns(true);
        break;
    case 'agent_end':
        isProcessing = false;
        hideTyping();
        setBtns(false);
        finishAiMsg();
        break;
    case 'message_start':
        if (ev.message && ev.message.role === 'user') {
            const txt = getTextContent(ev.message);
            if (txt) addUserMsg(txt);
        }
        break;
    case 'message_update': {
        const am = ev.assistantMessageEvent;
        if (!am) break;
        hasResponded = true;

        if (am.type === 'thinking_start') {
            hideTyping();
            if (!aiThinkingEl) {
                aiThinkingEl = document.createElement('div');
                aiThinkingEl.className = 'thinking';
                aiThinkingEl.onclick = function() { this.classList.toggle('expanded'); };
                aiThinkingEl.innerHTML = '<div class="thinking-header"><span>Thinking</span><span>▼</span></div><span></span>';
                aiThinkingSpan = aiThinkingEl.lastElementChild;
                chat.appendChild(aiThinkingEl);
                scroll();
            }
        }
        if (am.type === 'thinking_delta' && aiThinkingSpan) {
            aiThinkingSpan.textContent += am.delta;
            scroll();
        }
        if (am.type === 'thinking_end') {
            if (aiThinkingSpan) aiThinkingSpan.textContent = am.content || aiThinkingSpan.textContent;
        }

        if (am.type === 'start' || am.type === 'text_start') {
            if (!aiMsg) {
                aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai';
                aiMsg.innerHTML = '<span class="ts"></span>';
                aiTextSpan = document.createElement('span');
                aiMsg.appendChild(aiTextSpan);
                chat.appendChild(aiMsg);
            }
        }
        if (am.type === 'text_delta' && aiTextSpan) {
            aiTextSpan.textContent += am.delta;
            scroll();
        }
        if (am.type === 'toolcall_end') {
            const tc = am.toolCall;
            if (tc) addToolCall(tc.name, tc.args);
        }
        break;
    }
    case 'tool_execution_start':
        addToolCall(ev.name || ev.toolCall || '?', ev.args);
        break;
    case 'tool_execution_end':
        break;
    case 'compaction_start':
        if (!isProcessing) { isProcessing = true; setBtns(true); showTyping(); }
        break;
    case 'compaction_end':
        break;
    case 'auto_retry_start':
        if (!isProcessing) { isProcessing = true; setBtns(true); showTyping(); }
        break;
    case 'auto_retry_end':
        break;
    }
};

function finishAiMsg() {
    if (aiMsg) {
        const tsEl = aiMsg.querySelector('.ts');
        if (tsEl) tsEl.textContent = ts();
    }
    aiMsg = null;
    aiTextSpan = null;
    aiThinkingEl = null;
    aiThinkingSpan = null;
    scroll();
}

function getTextContent(msg) {
    if (!msg || !msg.content) return '';
    const parts = msg.content.filter(p => p.type === 'text');
    return parts.map(p => p.text).join('\n');
}

window.onWsOpen = function() {
    statusDot.className = 'dot on';
    overlay.classList.remove('show');
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
};

window.onWsClose = function() {
    statusDot.className = 'dot er';
    hideTyping();
    setBtns(false);
    isProcessing = false;
    countNum = 15;
    document.getElementById('countDown').textContent = countNum;
    overlay.classList.add('show');
    reconnectTimer = setInterval(() => {
        countNum--;
        document.getElementById('countDown').textContent = countNum;
        if (countNum <= 0) {
            overlay.classList.remove('show');
            if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
        }
    }, 1000);
};

window.onWsError = function(msg) {
    statusDot.className = 'dot er';
    overlay.classList.add('show');
};

input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

function sendMessage() {
    const t = input.value.trim();
    if (!t || isProcessing) return;
    input.value = '';
    input.style.height = 'auto';
    ChatBridge.send(JSON.stringify({type:'prompt',message:t}));
}

sendBtn.addEventListener('click', sendMessage);

stopBtn.addEventListener('click', () => {
    ChatBridge.send(JSON.stringify({type:'abort'}));
    isProcessing = false;
    hideTyping();
    setBtns(false);
    finishAiMsg();
});

newBtn.addEventListener('click', () => {
    ChatBridge.send(JSON.stringify({type:'new_session'}));
    chat.innerHTML = '';
    isProcessing = false;
    hideTyping();
    setBtns(false);
    aiMsg = null;
    aiTextSpan = null;
    aiThinkingEl = null;
    aiThinkingSpan = null;
});

configBtn.addEventListener('click', () => ChatBridge.openConfig());
</script>
</body>
</html>
