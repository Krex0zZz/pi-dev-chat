<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pi Dev Chat</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0C0F;--surface:#14161B;--elevated:#1C1F26;--border:#262A34;
  --text:#E4E6EB;--text-dim:#8B8F9A;--accent:#8B5CF6;--accent-bg:rgba(139,92,246,.12);
  --user-bg:#1E2130;--ai-bg:#16181F;--code-bg:#12131A;
  --danger:#F87171;--success:#34D399;--json-key:#C084FC;--json-str:#86EFAC;
  --json-num:#FCD34D;--json-bool:#60A5FA;--json-null:#9CA3AF;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}

/* ── Header (fixed top) ── */
#hdr{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
#hdr .title{flex:1;font-size:16px;font-weight:700;letter-spacing:.3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text-dim);transition:background .3s,box-shadow .3s}
.dot.on{background:var(--success);box-shadow:0 0 8px rgba(52,211,153,.4)}
.dot.off{background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.ib{background:none;border:none;color:var(--text-dim);font-size:20px;padding:6px 8px;line-height:1;cursor:pointer}

/* ── Chat area (fixed between header and input) ── */
#chat{position:fixed;top:48px;bottom:64px;left:0;right:0;overflow-y:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}

/* ── Bubbles ── */
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;word-break:break-word;overflow-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--user-bg);border:1px solid var(--border);border-bottom-right-radius:4px;margin-left:auto}
.bubble.ai{align-self:flex-start;background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble .time{display:block;font-size:10.5px;color:var(--text-dim);margin-bottom:5px;text-align:right}
.bubble.user .time{text-align:right}
.bubble.ai .time{text-align:left}

/* ── Markdown styles ── */
.md h1{font-size:18px;font-weight:700;color:#fff;margin:8px 0 4px}
.md h2{font-size:16px;font-weight:600;color:#fff;margin:6px 0 3px}
.md h3{font-size:15px;font-weight:600;color:var(--accent);margin:6px 0 3px}
.md h4{font-size:14.5px;font-weight:600;color:var(--accent);margin:4px 0 2px}
.md p{margin:5px 0}
.md strong{color:#fff;font-weight:600}
.md em{color:#D4D6DD;font-style:italic}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.md ul,.md ol{padding-left:18px;margin:4px 0}
.md li{margin:2px 0}
.md blockquote{border-left:3px solid var(--accent);padding:5px 10px;margin:5px 0;color:var(--text-dim);background:var(--code-bg);border-radius:0 6px 6px 0}
.md hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.md del{color:var(--text-dim)}
.md code:not(.code-body code){background:var(--code-bg);padding:2px 6px;border-radius:5px;font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:13px;color:#E0D4F5}

/* ── Code blocks ── */
.code-block{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;margin:7px 0;overflow:hidden}
.code-hdr{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--accent-bg);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px}
.copy-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-size:11px;padding:2px 8px;border-radius:5px;cursor:pointer}
.copy-btn:active{background:var(--accent-bg)}
.code-body{padding:8px 12px;font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:12.5px;line-height:1.45;overflow-x:auto;white-space:pre;color:var(--text);tab-size:4}

/* ── JSON blocks ── */
.json-block{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;margin:7px 0;padding:8px 12px;font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:12px;line-height:1.45;overflow-x:auto;white-space:pre;color:var(--text)}
.jk{color:var(--json-key)}.js{color:var(--json-str)}.jn{color:var(--json-num)}.jb{color:var(--json-bool)}.jx{color:var(--json-null)}

/* ── Tables ── */
.md-tbl{width:100%;border-collapse:collapse;margin:7px 0;font-size:13px}
.md-tbl th{background:var(--elevated);color:#fff;font-weight:600;padding:6px 10px;border:1px solid var(--border);text-align:left}
.md-tbl td{padding:6px 10px;border:1px solid var(--border)}
.md-tbl tr:nth-child(even) td{background:rgba(139,92,246,.04)}

/* ── Thinking ── */
.thinking{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;margin:5px 0;padding:8px 12px;font-size:12.5px;color:var(--text-dim);cursor:pointer;max-height:90px;overflow:hidden;transition:max-height .3s;align-self:flex-start;max-width:88%}
.thinking.open{max-height:500px;overflow-y:auto}
.thinking-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}

/* ── Tool call ── */
.tool-call{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;margin:4px 0;align-self:flex-start;max-width:88%}
.tool-name{color:var(--accent);font-weight:600}
.tool-args{color:var(--text-dim);white-space:pre-wrap;font-family:monospace;display:block;margin-top:3px}

/* ── Typing indicator ── */
.typing{align-self:flex-start;padding:10px 16px;background:var(--ai-bg);border:1px solid var(--border);border-radius:16px}
.typing-dots{display:inline-flex;gap:4px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;opacity:.4}
.typing-dots span:nth-child(1){animation:td .85s infinite 0s}
.typing-dots span:nth-child(2){animation:td .85s infinite .18s}
.typing-dots span:nth-child(3){animation:td .85s infinite .36s}
@keyframes td{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}

/* ── Input bar (fixed bottom) ── */
#bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;padding:8px 10px 14px;gap:8px;background:var(--surface);border-top:1px solid var(--border);z-index:10}
#bar .iw{flex:1}
#msgInput{width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-size:14.5px;font-family:inherit;line-height:1.4;resize:none;outline:none;max-height:110px;overflow-y:auto;transition:border-color .2s}
#msgInput:focus{border-color:var(--accent)}
#msgInput::placeholder{color:var(--text-dim)}
.ab{border:none;border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
.ab:active{opacity:.6}
#sendBtn{background:var(--accent);color:#fff;display:flex}
#stopBtn{background:var(--elevated);color:var(--danger)}
#newBtn{background:var(--elevated);color:var(--text-dim)}

/* ── Overlay ── */
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:99}
#overlay.show{display:flex}
#overlay .ot{font-size:16px;color:var(--text-dim)}
#overlay .oc{font-size:40px;font-weight:700;color:var(--accent)}
#overlay .ob{background:var(--accent);color:#fff;border:none;padding:11px 30px;border-radius:22px;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<div id="hdr">
  <button class="ib" id="btnCfg">&#9881;</button>
  <span class="title">Pi Dev Chat</span>
  <div class="dot" id="dot"></div>
</div>

<div id="chat"></div>

<div id="bar">
  <button class="ab" id="newBtn">&#9670;</button>
  <button class="ab" id="stopBtn">&#9632;</button>
  <div class="iw"><textarea id="msgInput" rows="1" placeholder="Type a message…"></textarea></div>
  <button class="ab" id="sendBtn">&#9658;</button>
</div>

<div id="overlay">
  <span class="ot">Disconnected</span>
  <span class="oc" id="cnt">--</span>
  <button class="ob" onclick="ChatBridge.openConfig()">Settings</button>
</div>

<script>
"use strict";

/* ── DOM refs ── */
var $chat=document.getElementById('chat');
var $inp=document.getElementById('msgInput');
var $send=document.getElementById('sendBtn');
var $stop=document.getElementById('stopBtn');
var $new=document.getElementById('newBtn');
var $dot=document.getElementById('dot');
var $ov=document.getElementById('overlay');
var $cfg=document.getElementById('btnCfg');

/* ── State ── */
var busy=false;
var $aiBody=null;
var $thinkTxt=null;
var $typing=null;
var clearedUntil=0; // timestamp after which stale events are allowed

/* ════════════ UTILS ════════════ */
function tstr(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();return(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function scroll(){requestAnimationFrame(function(){$chat.scrollTop=$chat.scrollHeight})}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ════════════ JSON PRETTIFIER ════════════ */
function jsonPretty(str){
  try{
    var o=JSON.parse(str),r=[];
    function w(v,d){
      var p0='  '.repeat(d),p1='  '.repeat(d+1);
      if(v===null){r.push('<span class="jx">null</span>');return}
      if(typeof v==='boolean'){r.push('<span class="jb">'+v+'</span>');return}
      if(typeof v==='number'){r.push('<span class="jn">'+v+'</span>');return}
      if(typeof v==='string'){r.push('<span class="js">"'+esc(v)+'"</span>');return}
      var k=Object.keys(v);
      if(!k.length){r.push(Array.isArray(v)?'[]':'{}');return}
      var op=Array.isArray(v)?'[':'{',cl=Array.isArray(v)?']':'}';
      r.push(op+'\n');
      for(var i=0;i<k.length;i++){
        r.push(p1);
        if(!Array.isArray(v))r.push('<span class="jk">"'+esc(k[i])+'"</span>: ');
        w(v[k[i]],d+1);
        if(i<k.length-1)r.push(',');
        r.push('\n');
      }
      r.push(p0+cl);
    }
    w(o,0);return r.join('');
  }catch(e){return null}
}

/* ════════════ INLINE MARKDOWN ════════════ */
function iMD(t){
  var s=esc(t);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__(.+?)__/g,'<strong>$1</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/(?<![a-z])_(.+?)_(?![a-z])/g,'<em>$1</em>');
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>');
  return s;
}

/* ════════════ FULL MARKDOWN ════════════ */
function rMD(text){
  if(!text)return'';
  var lines=text.split('\n'),out=[],i=0,li=[],lt='ul';
  function fl(){if(li.length){out.push('<'+lt+'>');for(var j=0;j<li.length;j++)out.push('<li>'+iMD(li[j])+'</li>');out.push('</'+lt+'>');li=[]}}
  while(i<lines.length){
    var l=lines[i];
    var cb=l.trimStart().match(/^```(\w*)$/);
    if(cb){fl();var lang=cb[1]||'code',cl=[];i++;
      while(i<lines.length&&!lines[i].trimStart().startsWith('```')){cl.push(lines[i]);i++}
      i++;var rc=cl.join('\n'),sr=esc(rc),en=btoa(unescape(encodeURIComponent(rc)));
      var pj=jsonPretty(rc);
      if(lang==='json'&&pj)out.push('<div class="json-block">'+pj+'</div>');
      else out.push('<div class="code-block"><div class="code-hdr"><span>'+esc(lang)+'</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><div class="code-body" data-code="'+en+'">'+sr+'</div></div>');
      continue}
    if(l.includes('|')&&i+1<lines.length&&/^\s*[\s\|:-]+\s*$/.test(lines[i+1])){
      fl();var rows=[l];i++;i++;
      while(i<lines.length&&lines[i].includes('|')){rows.push(lines[i]);i++}
      out.push(tbl(rows));continue}
    var hm=l.match(/^(#{1,6})\s+(.*)$/);
    if(hm){fl();out.push('<h'+hm[1].length+'>'+iMD(hm[2])+'</h'+hm[1].length+'>');i++;continue}
    if(/^[-*_]{3,}\s*$/.test(l.trim())){fl();out.push('<hr>');i++;continue}
    if(l.trimStart()[0]==='>'){fl();var bq=[];
      while(i<lines.length&&lines[i].trimStart()[0]==='>'){bq.push(lines[i].trimStart().replace(/^>\s?/,''));i++}
      out.push('<blockquote>'+iMD(bq.join('\n'))+'</blockquote>');continue}
    var ul=l.match(/^(\s*)[-*+]\s+(.*)$/);
    if(ul){if(!li.length||lt!=='ul'){fl();lt='ul'}li.push(ul[2]);i++;continue}
    var ol=l.match(/^(\s*)\d+\.\s+(.*)$/);
    if(ol){if(!li.length||lt!=='ol'){fl();lt='ol'}li.push(ol[2]);i++;continue}
    if(l.trim()===''){fl();out.push('<br>');i++;continue}
    fl();out.push('<p>'+iMD(l)+'</p>');i++}
  fl();return out.join('');
}

function tbl(rows){
  if(rows.length<2)return'';
  function sp(s){return s.split('|').filter(function(c,idx,a){return!(idx===0&&c.trim()==='')&&!(idx===a.length-1&&c.trim()==='')})}
  var h='<table class="md-tbl"><thead><tr>';
  var hd=sp(rows[0]);
  for(var j=0;j<hd.length;j++)h+='<th>'+iMD(hd[j].trim())+'</th>';
  h+='</tr></thead><tbody>';
  for(var i=1;i<rows.length;i++){var cs=sp(rows[i]);h+='<tr>';
    for(var j=0;j<cs.length;j++)h+='<td>'+iMD(cs[j].trim())+'</td>';h+='</tr>'}
  return h+'</tbody></table>';
}

/* ════════════ COPY ════════════ */
function copyCode(btn){
  var cd=btn.closest('.code-block').querySelector('.code-body');
  var code=decodeURIComponent(escape(atob(cd.dataset.code)));
  if(navigator.clipboard)navigator.clipboard.writeText(code);
  else{var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}
  btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy'},1800);
}

/* ════════════ CHAT HELPERS ════════════ */

function addMsg(role,text){
  var d=document.createElement('div');
  d.className='bubble '+(role==='user'?'user':'ai');
  var ts=document.createElement('span');ts.className='time';ts.textContent=tstr();
  var body=document.createElement('div');body.className='md';
  if(role==='user')body.innerHTML='<p>'+iMD(text)+'</p>';
  else body.textContent=text;
  d.appendChild(ts);d.appendChild(body);$chat.appendChild(d);scroll();
  return body;
}

function showType(){
  if($typing)return;
  $typing=document.createElement('div');$typing.className='typing';
  var inner=document.createElement('span');inner.className='typing-dots';
  for(var i=0;i<3;i++){var s=document.createElement('span');inner.appendChild(s)}
  $typing.appendChild(inner);$chat.appendChild($typing);scroll();
}
function hideType(){if($typing){$typing.remove();$typing=null}}

function ensureAI(){
  if($aiBody)return;
  var d=document.createElement('div');d.className='bubble ai';
  var ts=document.createElement('span');ts.className='time';ts.textContent='';
  $aiBody=document.createElement('div');$aiBody.className='md';
  d.appendChild(ts);d.appendChild($aiBody);$chat.appendChild(d);
}

function addThink(){
  if($thinkTxt)return;
  var el=document.createElement('div');el.className='thinking';
  el.addEventListener('click',function(){this.classList.toggle('open')});
  var hdr=document.createElement('div');hdr.className='thinking-label';
  hdr.innerHTML='<span>&#9855; Thinking</span><span>&#9660;</span>';
  el.appendChild(hdr);
  $thinkTxt=document.createElement('span');el.appendChild($thinkTxt);
  $chat.appendChild(el);scroll();
}

function addTool(name,args){
  var d=document.createElement('div');d.className='tool-call';
  var n=document.createElement('span');n.className='tool-name';n.textContent='\u26A1 '+name;
  var a=document.createElement('span');a.className='tool-args';a.textContent=JSON.stringify(args||{});
  d.appendChild(n);d.appendChild(a);$chat.appendChild(d);scroll();
}

function setBusy(y){
  if(y){$send.style.display='none';$stop.style.display='flex';$new.style.display='none';$inp.disabled=true;busy=true}
  else{$send.style.display='flex';$stop.style.display='none';$new.style.display='flex';$inp.disabled=false;busy=false}
}

function finishTurn(){
  if($aiBody){
    var tsEl=$aiBody.parentElement.querySelector('.time');
    if(tsEl)tsEl.textContent=tstr();
    var raw=$aiBody.textContent;
    if(raw.trim()){$aiBody.innerHTML=rMD(raw);scroll()}
  }
  $aiBody=null;$thinkTxt=null;scroll();
}

function getTxt(msg){
  if(!msg||!msg.content)return'';var t='';
  for(var i=0;i<msg.content.length;i++)if(msg.content[i].type==='text')t+=msg.content[i].text;
  return t;
}

/* ════════════ EVENT DISPATCHER ════════════ */

window.onMessage=function(raw){
  var ev;try{ev=JSON.parse(raw)}catch(e){return}
  var am;
  if(Date.now()<clearedUntil && ev.type!=='session_reset') return; // ignore stale events during restart
  switch(ev.type){
  case 'agent_start':hideType();showType();setBusy(true);break;
  case 'agent_end':hideType();setBusy(false);finishTurn();break;
  case 'message_start':
    if(ev.message&&ev.message.role==='user'){var t=getTxt(ev.message);if(t)addMsg('user',t)}
    break;
  case 'message_update':
    am=ev.assistantMessageEvent;if(!am)break;
    if(am.type==='thinking_start'){hideType();addThink()}
    if(am.type==='thinking_delta'&&$thinkTxt){$thinkTxt.textContent+=am.delta;scroll()}
    if(am.type==='thinking_end'&&$thinkTxt){$thinkTxt.textContent=am.content||$thinkTxt.textContent}
    if(am.type==='start'||am.type==='text_start'){hideType();ensureAI()}
    if(am.type==='text_delta'&&$aiBody){$aiBody.textContent+=am.delta;scroll()}
    if(am.type==='text_end'&&$aiBody){$aiBody.textContent=am.content||$aiBody.textContent}
    if(am.type==='toolcall_end'&&am.toolCall){addTool(am.toolCall.name,am.toolCall.args)}
    break;
  case 'tool_execution_start':addTool(ev.name||ev.toolCall||'?',ev.args);break;
  case 'compaction_start':if(!busy){setBusy(true);showType()}break;
  case 'compaction_end':hideType();break;
  case 'auto_retry_start':if(!busy){setBusy(true);showType()}break;
  case 'auto_retry_end':hideType();break;
  }
};

/* ════════════ WS STATUS ════════════ */
var rcT=null;
window.onWsOpen=function(){
  $dot.className='dot on';$ov.classList.remove('show');
  if(rcT){clearInterval(rcT);rcT=null}
};
window.onWsClose=function(){
  $dot.className='dot off';hideType();setBusy(false);
  var c=15;document.getElementById('cnt').textContent=c;
  $ov.classList.add('show');
  if(rcT)clearInterval(rcT);
  rcT=setInterval(function(){c--;document.getElementById('cnt').textContent=c;
    if(c<=0){$ov.classList.remove('show');clearInterval(rcT);rcT=null}},1000);
};
window.onWsError=function(){$dot.className='dot off';$ov.classList.add('show')};

/* ════════════ INPUT & BUTTONS ════════════ */
$inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
$inp.addEventListener('input',function(){$inp.style.height='auto';$inp.style.height=Math.min($inp.scrollHeight,110)+'px'});

function doSend(){
  var t=$inp.value.trim();
  if(!t||busy)return;
  $inp.value='';$inp.style.height='auto';
  ChatBridge.send(JSON.stringify({type:'prompt',message:t}));
}
$send.addEventListener('click',doSend);

$stop.addEventListener('click',function(){
  ChatBridge.send(JSON.stringify({type:'abort'}));
  hideType();setBusy(false);finishTurn();
});

$new.addEventListener('click',function(){
  $chat.innerHTML='';
  hideType();setBusy(false);
  $aiBody=null;$thinkTxt=null;
  clearedUntil=Date.now()+2000; // ignore stale events for 2s during proxy restart
  ChatBridge.send(JSON.stringify({type:'new_session'}));
});

$cfg.addEventListener('click',function(){ChatBridge.openConfig()});
</script>
</body>
</html>
