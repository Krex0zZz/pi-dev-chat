<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pi Dev Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0D110F;--surface:#161B17;--surface-alt:#1B211D;
  --ink:#E0E8DD;--ink-soft:#A6B5A8;--ink-muted:#6E7B70;--ink-faint:#4F5A52;
  --border:rgba(180,220,180,0.08);--border-strong:rgba(180,220,180,0.16);
  --sage:#7BC894;--sage-deep:#5BAE76;--sage-soft:rgba(123,200,148,0.14);
  --tan:#E2B17A;--tan-soft:rgba(226,177,122,0.14);
  --code-bg:#0F1612;
}
html,body{height:100%;overflow:hidden;font-family:'Geist',system-ui,sans-serif;font-size:15px;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}

/* ── Top Bar ── */
#hdr{position:fixed;top:0;left:0;right:0;padding-top:0;padding-bottom:12px;background:var(--bg);border-bottom:0.5px solid var(--border);z-index:10}
#hdr-row{display:flex;align-items:center;gap:8;padding:0 12px}
#btnCfg{width:36px;height:36px;border:none;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10}
#pill{flex:1;display:flex;align-items:center;gap:6;padding:6px 12px;background:var(--surface);border-radius:100;border:0.5px solid var(--border);justify-content:center}
.dot{width:6px;height:6px;border-radius:3px;background:var(--ink-faint);transition:background .3s,box-shadow .3s}
.dot.on{background:var(--sage);box-shadow:0 0 8px var(--sage)}
.dot.off{background:var(--tan);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
#model{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--ink);letter-spacing:-.1px}

/* ── Chat ── */
#chat{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;padding-top:56px;padding-bottom:68px;-webkit-overflow-scrolling:touch}
#chat::-webkit-scrollbar{display:none}
#chat{scrollbar-width:none}

/* ── User bubble ── */
.bubble.user{padding:12px 16px}
.bubble.user .md{padding-left:32px;font-size:15.5px;line-height:1.5;color:var(--ink);letter-spacing:-.1px}

/* ── AI bubble ── */
.bubble.ai{padding:12px 16px}
.bubble.ai .md{background:var(--surface);border-radius:14px;border:0.5px solid var(--border);padding:12px 14px;font-size:15px;line-height:1.55;color:var(--ink);letter-spacing:-.1px}
.bubble.ai .md p{margin:8px 0 0}.bubble.ai .md p:first-child{margin-top:0}
.bubble.ai .md strong{font-weight:600;color:var(--ink)}
.bubble.ai .md em{color:var(--ink-soft);font-style:italic}
.bubble.ai .md a{color:var(--sage);text-decoration:underline}
.bubble.ai .md code{background:var(--surface-alt);padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#E0D4F5}
.bubble.ai .md .bullet-list{margin:6px 0 0;padding-left:0;list-style:none}
.bubble.ai .md .bullet-list li{display:flex;gap:10px;padding:2px 0}
.bubble.ai .md .bullet-list li::before{content:'';color:var(--sage);margin-top:9px;flex-shrink:0;width:5px;height:1.5px;background:var(--sage)}

/* ── Code blocks ── */
.code-block{background:var(--code-bg);border:0.5px solid rgba(255,255,255,0.04);border-radius:12px;margin:6px 0;overflow:hidden;color:#E8EFE8}
.code-hdr{display:flex;align-items:center;gap:8;padding:6px 12px;border-bottom:0.5px solid rgba(255,255,255,0.08);font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(232,239,232,0.5);letter-spacing:.4px;text-transform:uppercase}
.code-hdr .code-dot{width:8px;height:8px;border-radius:4px;background:var(--tan)}
.copy-btn{background:none;border:none;color:rgba(232,239,232,0.6);cursor:pointer;font-family:'Geist',sans-serif;font-size:11px;margin-left:auto}
.code-body{padding:12px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre;tab-size:4}

/* ── JSON blocks ── */
.json-block{background:var(--code-bg);border:0.5px solid rgba(255,255,255,0.04);border-radius:12px;margin:6px 0;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.45;overflow-x:auto;white-space:pre;color:#E8EFE8}
.jk{color:var(--sage)}.js{color:var(--ink-soft)}.jn{color:var(--tan)}.jb{color:#60A5FA}.jx{color:var(--ink-muted)}

/* ── Tables ── */
.md-tbl{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px}
.md-tbl th{background:var(--surface-alt);color:var(--ink);font-weight:600;padding:5px 8px;border:0.5px solid var(--border);text-align:left}
.md-tbl td{padding:5px 8px;border:0.5px solid var(--border)}
.md-tbl tr:nth-child(even) td{background:rgba(123,200,148,0.04)}

/* ── Blockquotes ── */
.bubble.ai .md blockquote{border-left:2px solid var(--sage);padding-left:12px;margin:6px 0;color:var(--ink-soft);font-style:italic}

/* ── Thinking ── */
.thinking{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;margin:4px 16px;overflow:hidden}
.thinking-label{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-family:'Geist',sans-serif;font-size:12px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.3px;cursor:pointer}
.thinking-label span:last-child{color:var(--ink-faint);font-size:11px}
.thinking .think-body{display:block;padding:0 12px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);line-height:1.5;word-break:break-word}
.thinking:not(.open) .think-body{display:none}

/* ── Tool calls ── */
.tool-call{display:flex;gap:8;align-items:baseline;padding:6px 16px;font-family:'JetBrains Mono',monospace;font-size:11px}
.tool-name{color:var(--tan);font-weight:600}
.tool-args{color:var(--ink-muted)}

/* ── Bubble header ── */
.time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-faint);margin-bottom:4px;display:block}

/* ── Typing indicator ── */
.typing{padding:8px 16px;margin-top:4px}
.typing-dots{display:inline-flex;gap:4px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--sage);display:inline-block;opacity:.4}
.typing-dots span:nth-child(1){animation:td .85s infinite 0s}
.typing-dots span:nth-child(2){animation:td .85s infinite .18s}
.typing-dots span:nth-child(3){animation:td .85s infinite .36s}
@keyframes td{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}

/* ── Composer ── */
#bar{position:fixed;bottom:0;left:0;right:0;padding:8px 12px 14px;background:var(--bg);border-top:0.5px solid var(--border);z-index:10}
#bar-inner{background:var(--surface);border-radius:14px;border:0.5px solid var(--border-strong)}
#bar-row{display:flex;align-items:flex-end;gap:6;padding:4px 4px 4px 14px}
#prompt-glyph{align-self:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sage);font-weight:600}
#msgInput{flex:1;border:none;outline:none;resize:none;background:transparent;font-family:'Geist',sans-serif;font-size:15px;color:var(--ink);padding:10px 0;line-height:1.4;max-height:100px;overflow-y:auto;box-sizing:border-box}
#msgInput::placeholder{color:var(--ink-faint)}
#sendBtn,#stopBtn{width:34px;height:34px;border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
#sendBtn{background:var(--sage);color:var(--bg)}
#stopBtn{background:var(--tan);color:var(--bg);display:none}

/* ── Overlay ── */
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:99}
#overlay.show{display:flex}
#overlay .ot{font-size:16px;color:var(--ink-muted);font-family:'Geist',sans-serif}
#overlay .oc{font-size:40px;font-weight:700;color:var(--sage);font-family:'Geist',sans-serif}
#overlay .ob{background:var(--sage);color:var(--bg);border:none;padding:11px 30px;border-radius:22px;font-size:14px;cursor:pointer;font-family:'Geist',sans-serif}

/* ── New Chat button ── */
#newBtn{width:36px;height:36px;border:none;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10;border:0.5px solid var(--border)}
</style>
</head>
<body>

<!-- Top bar -->
<div id="hdr">
  <div id="hdr-row">
    <button id="btnCfg">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div id="pill">
      <div id="dot" class="dot"></div>
      <span id="model">pi:rpc</span>
    </div>
    <button id="newBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7BC894" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
    </button>
  </div>
</div>

<!-- Chat -->
<div id="chat"></div>

<!-- Composer -->
<div id="bar">
  <div id="bar-inner">
    <div id="bar-row">
      <span id="prompt-glyph">❯❯</span>
      <textarea id="msgInput" rows="1" placeholder="ask pi anything…"></textarea>
      <button id="sendBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <button id="stopBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Disconnect overlay -->
<div id="overlay">
  <span class="ot">Disconnected</span>
  <span class="oc" id="cnt">--</span>
  <button class="ob" onclick="ChatBridge.openConfig()">Settings</button>
</div>

<script>
"use strict";

/* ── DOM refs ── */
var $chat=document.getElementById('chat');
var $inp=document.getElementById('msgInput');
var $send=document.getElementById('sendBtn');
var $stop=document.getElementById('stopBtn');
var $new=document.getElementById('newBtn');
var $dot=document.getElementById('dot');
var $ov=document.getElementById('overlay');
var $cfg=document.getElementById('btnCfg');

/* ── State ── */
var busy=false;
var $aiBody=null;
var $thinkTxt=null;
var $typing=null;
var clearedUntil=0;

/* ════════════ UTILS ════════════ */
function tstr(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();return(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function scroll(){requestAnimationFrame(function(){$chat.scrollTop=$chat.scrollHeight})}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ════════════ JSON PRETTIFIER ════════════ */
function jsonPretty(str){
  try{
    var o=JSON.parse(str),r=[];
    function w(v,d){
      var p0='  '.repeat(d),p1='  '.repeat(d+1);
      if(v===null){r.push('<span class="jx">null</span>');return}
      if(typeof v==='boolean'){r.push('<span class="jb">'+v+'</span>');return}
      if(typeof v==='number'){r.push('<span class="jn">'+v+'</span>');return}
      if(typeof v==='string'){r.push('<span class="js">"'+esc(v)+'"</span>');return}
      var k=Object.keys(v);
      if(!k.length){r.push(Array.isArray(v)?'[]':'{}');return}
      var op=Array.isArray(v)?'[':'{',cl=Array.isArray(v)?']':'}';
      r.push(op+'\n');
      for(var i=0;i<k.length;i++){
        r.push(p1);
        if(!Array.isArray(v))r.push('<span class="jk">"'+esc(k[i])+'"</span>: ');
        w(v[k[i]],d+1);
        if(i<k.length-1)r.push(',');
        r.push('\n');
      }
      r.push(p0+cl);
    }
    w(o,0);return r.join('');
  }catch(e){return null}
}

/* ════════════ INLINE MARKDOWN ════════════ */
function iMD(t){
  var s=esc(t);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__(.+?)__/g,'<strong>$1</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/(?<![a-z])_(.+?)_(?![a-z])/g,'<em>$1</em>');
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>');
  return s;
}

/* ════════════ FULL MARKDOWN ════════════ */
function rMD(text){
  if(!text)return'';
  var lines=text.split('\n'),out=[],i=0,li=[],lt='ul';
  function fl(){if(li.length){out.push('<'+lt+'>');for(var j=0;j<li.length;j++)out.push('<li>'+iMD(li[j])+'</li>');out.push('</'+lt+'>');li=[]}}
  while(i<lines.length){
    var l=lines[i];
    var cb=l.trimStart().match(/^```(\w*)$/);
    if(cb){fl();var lang=cb[1]||'code',cl=[];i++;
      while(i<lines.length&&!lines[i].trimStart().startsWith('```')){cl.push(lines[i]);i++}
      i++;var rc=cl.join('\n'),sr=esc(rc),en=btoa(unescape(encodeURIComponent(rc)));
      var pj=jsonPretty(rc);
      if(lang==='json'&&pj)out.push('<div class="json-block">'+pj+'</div>');
      else out.push('<div class="code-block"><div class="code-hdr"><span class="code-dot"></span>'+esc(lang)+'<button class="copy-btn" onclick="copyCode(this)">Copy</button></div><div class="code-body" data-code="'+en+'">'+sr+'</div></div>');
      continue}
    if(l.includes('|')&&i+1<lines.length&&/^\s*[\s\|:-]+\s*$/.test(lines[i+1])){
      fl();var rows=[l];i++;i++;
      while(i<lines.length&&lines[i].includes('|')){rows.push(lines[i]);i++}
      out.push(tbl(rows));continue}
    var hm=l.match(/^(#{1,6})\s+(.*)$/);
    if(hm){fl();out.push('<h'+hm[1].length+'>'+iMD(hm[2])+'</h'+hm[1].length+'>');i++;continue}
    if(/^[-*_]{3,}\s*$/.test(l.trim())){fl();out.push('<hr>');i++;continue}
    if(l.trimStart()[0]==='>'){fl();var bq=[];
      while(i<lines.length&&lines[i].trimStart()[0]==='>'){bq.push(lines[i].trimStart().replace(/^>\s?/,''));i++}
      out.push('<blockquote>'+iMD(bq.join('\n'))+'</blockquote>');continue}
    var ul=l.match(/^(\s*)[-*+]\s+(.*)$/);
    if(ul){if(!li.length||lt!=='ul'){fl();lt='ul'}li.push(ul[2]);i++;continue}
    var ol=l.match(/^(\s*)\d+\.\s+(.*)$/);
    if(ol){if(!li.length||lt!=='ol'){fl();lt='ol'}li.push(ol[2]);i++;continue}
    if(l.trim()===''){fl();out.push('<br>');i++;continue}
    fl();out.push('<p>'+iMD(l)+'</p>');i++}
  fl();return out.join('');
}

function tbl(rows){
  if(rows.length<2)return'';
  function sp(s){return s.split('|').filter(function(c,idx,a){return!(idx===0&&c.trim()==='')&&!(idx===a.length-1&&c.trim()==='')})}
  var h='<table class="md-tbl"><thead><tr>';
  var hd=sp(rows[0]);
  for(var j=0;j<hd.length;j++)h+='<th>'+iMD(hd[j].trim())+'</th>';
  h+='</tr></thead><tbody>';
  for(var i=1;i<rows.length;i++){var cs=sp(rows[i]);h+='<tr>';
    for(var j=0;j<cs.length;j++)h+='<td>'+iMD(cs[j].trim())+'</td>';h+='</tr>'}
  return h+'</tbody></table>';
}

/* ════════════ COPY ════════════ */
function copyCode(btn){
  var cd=btn.closest('.code-block').querySelector('.code-body');
  var code=decodeURIComponent(escape(atob(cd.dataset.code)));
  if(navigator.clipboard)navigator.clipboard.writeText(code);
  else{var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}
  btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy'},1800);
}

/* ════════════ CHAT HELPERS ════════════ */

function addMsg(role,text){
  var d=document.createElement('div');
  d.className='bubble '+(role==='user'?'user':'ai');
  var ts=document.createElement('span');ts.className='time';ts.textContent=tstr();
  var body=document.createElement('div');body.className='md';
  if(role==='user')body.innerHTML='<p>'+iMD(text)+'</p>';
  else body.textContent=text;
  d.appendChild(ts);d.appendChild(body);$chat.appendChild(d);scroll();
  return body;
}

function showType(){
  if($typing)return;
  $typing=document.createElement('div');$typing.className='typing';
  var inner=document.createElement('span');inner.className='typing-dots';
  for(var i=0;i<3;i++){var s=document.createElement('span');inner.appendChild(s)}
  $typing.appendChild(inner);$chat.appendChild($typing);scroll();
}
function hideType(){if($typing){$typing.remove();$typing=null}}

function ensureAI(){
  if($aiBody)return;
  var d=document.createElement('div');d.className='bubble ai';
  var ts=document.createElement('span');ts.className='time';ts.textContent='';
  $aiBody=document.createElement('div');$aiBody.className='md';
  d.appendChild(ts);d.appendChild($aiBody);$chat.appendChild(d);
}

function addThink(){
  if($thinkTxt)return;
  var el=document.createElement('div');el.className='thinking open';
  el.addEventListener('click',function(){this.classList.toggle('open')});
  var hdr=document.createElement('div');hdr.className='thinking-label';
  hdr.innerHTML='<span>&#9855; Thinking</span><span>&#9660;</span>';
  el.appendChild(hdr);
  $thinkTxt=document.createElement('span');$thinkTxt.className='think-body';el.appendChild($thinkTxt);
  $chat.appendChild(el);scroll();
}

function addTool(name,args){
  var d=document.createElement('div');d.className='tool-call';
  var n=document.createElement('span');n.className='tool-name';n.textContent='\u26A1 '+name;
  var a=document.createElement('span');a.className='tool-args';a.textContent=JSON.stringify(args||{});
  d.appendChild(n);d.appendChild(a);$chat.appendChild(d);scroll();
}

function setBusy(y){
  if(y){$send.style.display='none';$stop.style.display='flex';$new.style.display='none';$inp.disabled=true;busy=true}
  else{$send.style.display='flex';$stop.style.display='none';$new.style.display='flex';$inp.disabled=false;busy=false}
}

function finishTurn(){
  if($aiBody){
    var tsEl=$aiBody.parentElement.querySelector('.time');
    if(tsEl)tsEl.textContent=tstr();
    var raw=$aiBody.textContent;
    if(raw.trim()){$aiBody.innerHTML=rMD(raw);scroll()}
  }
  $aiBody=null;$thinkTxt=null;scroll();
}

function getTxt(msg){
  if(!msg||!msg.content)return'';var t='';
  for(var i=0;i<msg.content.length;i++)if(msg.content[i].type==='text')t+=msg.content[i].text;
  return t;
}

/* ════════════ EVENT DISPATCHER (exact v1.6 logic) ════════════ */

window.onMessage=function(raw){
  var ev;try{ev=JSON.parse(raw)}catch(e){return}
  var am;
  if(Date.now()<clearedUntil && ev.type!=='session_reset') return;
  switch(ev.type){
  case 'session_reset':
    $chat.innerHTML='';$aiBody=null;$thinkTxt=null;hideType();setBusy(false);
    clearedUntil=Date.now()+2000;break;
  case 'agent_start':hideType();showType();setBusy(true);break;
  case 'agent_end':hideType();setBusy(false);finishTurn();break;
  case 'message_start':
    if(ev.message&&ev.message.role==='user'){var t=getTxt(ev.message);if(t)addMsg('user',t)}
    break;
  case 'message_update':
    am=ev.assistantMessageEvent;if(!am)break;
    if(am.type==='thinking_start'){hideType();addThink()}
    if(am.type==='thinking_delta'&&$thinkTxt){$thinkTxt.textContent+=am.delta;scroll()}
    if(am.type==='thinking_end'&&$thinkTxt){$thinkTxt.textContent=am.content||$thinkTxt.textContent}
    if(am.type==='start'||am.type==='text_start'){hideType();ensureAI()}
    if(am.type==='text_delta'&&$aiBody){$aiBody.textContent+=am.delta;scroll()}
    if(am.type==='text_end'&&$aiBody){$aiBody.textContent=am.content||$aiBody.textContent}
    if(am.type==='toolcall_end'&&am.toolCall){addTool(am.toolCall.name,am.toolCall.args)}
    break;
  case 'tool_execution_start':addTool(ev.name||ev.toolCall||'?',ev.args);break;
  case 'compaction_start':if(!busy){setBusy(true);showType()}break;
  case 'compaction_end':hideType();break;
  case 'auto_retry_start':if(!busy){setBusy(true);showType()}break;
  case 'auto_retry_end':hideType();break;
  }
};

/* ════════════ WS STATUS ════════════ */
var rcT=null;
window.onWsOpen=function(){
  $dot.className='dot on';$ov.classList.remove('show');
  if(rcT){clearInterval(rcT);rcT=null}
};
window.onWsClose=function(){
  $dot.className='dot off';hideType();setBusy(false);
  var c=15;document.getElementById('cnt').textContent=c;
  $ov.classList.add('show');
  if(rcT)clearInterval(rcT);
  rcT=setInterval(function(){c--;document.getElementById('cnt').textContent=c;
    if(c<=0){$ov.classList.remove('show');clearInterval(rcT);rcT=null}},1000);
};
window.onWsError=function(){$dot.className='dot off';$ov.classList.add('show')};

/* ════════════ INPUT & BUTTONS ════════════ */
$inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
$inp.addEventListener('input',function(){$inp.style.height='auto';$inp.style.height=Math.min($inp.scrollHeight,110)+'px'});

function doSend(){
  var t=$inp.value.trim();
  if(!t||busy)return;
  $inp.value='';$inp.style.height='auto';
  ChatBridge.send(JSON.stringify({type:'prompt',message:t}));
}
$send.addEventListener('click',doSend);

$stop.addEventListener('click',function(){
  ChatBridge.send(JSON.stringify({type:'abort'}));
  hideType();setBusy(false);finishTurn();
});

$new.addEventListener('click',function(){
  $chat.innerHTML='';
  hideType();setBusy(false);
  $aiBody=null;$thinkTxt=null;
  clearedUntil=Date.now()+2000;
  ChatBridge.send(JSON.stringify({type:'new_session'}));
});

$cfg.addEventListener('click',function(){ChatBridge.openConfig()});

/* Auto-resize on load */
$inp.style.height='auto';$inp.style.height=Math.min($inp.scrollHeight,110)+'px';
</script>
</body>
</html>
